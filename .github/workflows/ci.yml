name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned elan release, installed identically in every job below. Bump both together;
  # a mismatch fails the checksum step loudly rather than installing something unverified.
  ELAN_VER: v4.2.3
  ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install elan (pinned + checksum) and the toolchain
        run: |
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz" -o elan.tar.gz
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version

      # Keyed on lake-manifest.json so a dependency bump invalidates it; keyed on
      # lean-toolchain so a toolchain bump does too. Until lake-manifest.json exists (see
      # README.md: it is generated by `lake update` on a build host, not hand-written),
      # hashFiles resolves to an empty string and every run before that shares one key,
      # which is fine -- there is nothing to distinguish yet.
      - name: Restore/save the Lake build cache
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            .lake/packages
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-

      - name: Fetch Mathlib/Physlib/TauCeti oleans, retrying with a forced full refetch
        run: |
          if ! lake exe cache get Mathlib Physlib TauCeti; then
            echo "::warning::lake exe cache get Mathlib Physlib TauCeti failed; forcing a full refetch"
            lake exe cache get! Mathlib Physlib TauCeti
          fi

      # The lean_lib glob McLean.* is authoritative (see lakefile.toml), so an orphaned or
      # broken module still fails here -- this is the first of the three checks README.md
      # promises, and the only one with no prior CI run to compare against.
      - name: Build
        run: lake build

      - name: Axiom audit (McLean uses only allowlisted axioms)
        run: lake exe axioms

      - name: Module-system audit (every McLean file opts into `module`)
        run: lake exe module-system

      - name: Upload the resolved lake-manifest.json
        uses: actions/upload-artifact@v4
        with:
          name: lake-manifest
          path: lake-manifest.json
          if-no-files-found: warn
          retention-days: 7

  # A demonstration run: generates real DIS events with the now-built `mclean` exe and
  # uploads the HepMC3 output and a performance summary as artifacts. Reuses the `build`
  # job's cache rather than rebuilding EpsilonEridani/Mathlib from scratch again.
  demo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install elan (pinned + checksum) and the toolchain
        run: |
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz" -o elan.tar.gz
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"

      - name: Restore the Lake build cache
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            .lake/packages
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-

      - name: Build (cache hit expected; rebuilds only if the restore above missed)
        run: lake build

      - name: Run the mclean demonstration
        run: |
          time lake exe mclean \
            --events 2000 --seed 42 --shower \
            --output events.hepmc3 --perf-output perf.json

      - name: Sanity-check the generated events
        run: python3 scripts/check_events.py events.hepmc3 --events 2000 --q2min 1.0

      - name: Upload the demonstration run's artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mclean-demo-run
          path: |
            events.hepmc3
            perf.json
          if-no-files-found: error
          retention-days: 14
