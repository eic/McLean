<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>McLean</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0">
  <meta name="description" content="McLean: a Lean 4 event generator for deep inelastic scattering, built on EpsilonEridani">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'McLean',
      repo: 'eic/McLean',

      search: 'auto'

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
