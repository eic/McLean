name = "McLean"
defaultTargets = ["McLean"]

# McLean is a pure Lean package, like EpsilonEridani: its cached module outputs
# (.olean/.ilean/Lean IR/generated C) are reusable across platforms. The `mclean`
# executable is a platform-dependent output and Lake filters it out of that mapping
# automatically. Keep this in sync if native libraries or precompiled modules are added.
platformIndependent = true

# The physics. McLean depends on EpsilonEridani for the formalized physics and for the
# HepMC3 binding; Mathlib arrives transitively through it, which is why there is no
# explicit Mathlib require here. `rev` stays on "main"; lake-manifest.json carries the
# exact reproducible commit, and is generated by `lake update` on a build host.
[[require]]
name = "EpsilonEridani"
git = "https://github.com/eic/EpsilonEridani"
rev = "main"

# AI-owned: the event generator. This glob is AUTHORITATIVE for what gets built and
# axiom-audited -- `lake build` builds every McLean/*.lean directly and the audits
# enumerate the source tree, so an orphaned or broken module still fails the build.
# The root McLean.lean re-exports nothing and is intentionally empty: a PR never has to
# touch it, and no code imports it. Copied from EpsilonEridani for a concrete reason --
# a generated import manifest cannot be carried across repositories by patch, because its
# context lines are the neighbouring module names of whichever repository produced it.
# That cost 22 rejected hunks during the physlib port.
[[lean_lib]]
name = "McLean"
globs = ["McLean.*"]
# `longFile` and `longFileDefValue` must be set to the SAME value, or the linter nags to
# remove a `set_option` on every short file, which is fatal under `warningAsError`.
leanOptions = { weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, weak.linter.style.header = true, warningAsError = true }

# The generator binary. Its root deliberately sits OUTSIDE McLean/ so the library glob
# does not sweep it up: an executable entry point is not library content, and holding it
# to the module-system audit would mean giving `main` a `module` header. Keeping an exe
# target wired from the first commit is not ceremony -- in the predecessor repository the
# equivalent source exists but is attached to no Lake target, so it silently never builds,
# and separately an exe target there once failed to link for reasons unrelated to Lean.
# Neither is visible unless something actually builds an executable.
[[lean_exe]]
name = "mclean"
root = "generator.Main"

# Human-owned governance, carried over from EpsilonEridani with the audited root renamed.
# `lake exe axioms` inspects the built McLean environment and rejects any axiom outside
# {propext, Classical.choice, Quot.sound}, which catches `sorry` (as `sorryAx`),
# `native_decide` (as `Lean.ofReduceBool`) and any home-rolled axiom, including ones
# reaching in through imports. grep cannot do that.
[[lean_exe]]
name = "axioms"
root = "scripts.Axioms"

# `lake exe module-system` reads the compiled .oleans and rejects any module whose
# `ModuleData.isModule` is false, i.e. any file that did not open with `module`. It reads
# the artifact, not the source text, so a stray comment cannot fool it.
[[lean_exe]]
name = "module-system"
root = "scripts.ModuleSystem"
